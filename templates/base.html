<!DOCTYPE html>
<html lang="en" data-theme-pref="{{ settings.theme }}"{% if settings.theme != 'system' %} data-theme="{{ settings.theme }}" data-bs-theme="{{ settings.theme }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Generator</title>
  <link rel="icon" href="{{ url_for('static', filename='feedback-brand/favicon.ico') }}" sizes="16x16 32x32">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='feedback-brand/favicon-32.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='feedback-brand/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
  <nav class="navbar navbar-expand-sm bg-app mb-4">
    <div class="container">
      <a class="navbar-brand d-inline-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='feedback-brand/apple-touch-icon.png') }}" width="40" height="40" alt="">
        <span>Feedback Generator</span>
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{{ url_for('new_container') }}">+ New Container</a>
        <a class="nav-link" href="{{ url_for('new_template') }}">+ New Template</a>
        <a class="nav-link" href="{{ url_for('settings_page') }}">Settings</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
